name: Compléter ou corriger une course
description: Ajouter un D+, une date exacte, l'état des inscriptions… ou signaler une course manquante.
title: "[Course] "
labels: ["données"]
body:
  - type: markdown
    attributes:
      value: |
        Merci ! Une fois vérifiée, la proposition est transformée automatiquement en modification des
        données (étiquette « validé »). Indiquez de préférence une information publiée par l'organisateur.
  - type: input
    id: nom
    attributes:
      label: Nom de la course
      placeholder: Trail des Maures
    validations:
      required: true
  - type: input
    id: ville
    attributes:
      label: Commune de départ
      placeholder: Collobrières
    validations:
      required: true
  - type: input
    id: departement
    attributes:
      label: Département (numéro)
      description: Utile surtout pour une course qui manque.
      placeholder: "83"
  - type: input
    id: date
    attributes:
      label: Date (AAAA-MM-JJ)
      placeholder: 2027-05-07
  - type: textarea
    id: formats
    attributes:
      label: Distances et D+
      description: Une ligne par format, « km ; D+ en mètres ». Le D+ peut rester vide s'il n'est pas connu.
      placeholder: |
        166 ; 7500
        60 ; 3000
    validations:
      required: true
  - type: input
    id: site
    attributes:
      label: Site officiel
      placeholder: https://…
  - type: input
    id: inscription
    attributes:
      label: Lien d'inscription
      placeholder: https://…
  - type: dropdown
    id: statut
    attributes:
      label: Inscriptions
      options:
        - Je ne sais pas
        - Pas encore ouvertes
        - Ouvertes
        - Complet
        - Closes
  - type: input
    id: ouverture
    attributes:
      label: Date d'ouverture des inscriptions (AAAA-MM-JJ)
      placeholder: 2027-01-10
  - type: dropdown
    id: mode
    attributes:
      label: Mode d'attribution des dossards
      options:
        - Je ne sais pas
        - Inscription libre
        - Tirage au sort
        - Sur qualification
  - type: input
    id: prix
    attributes:
      label: Prix (si un seul format, ou celui du format principal)
      placeholder: "45"
  - type: input
    id: source
    attributes:
      label: Où avez-vous trouvé l'information ?
      description: De préférence le site de l'organisateur.
  - type: input
    id: ref
    attributes:
      label: Identifiant Agregatrail
      description: Rempli automatiquement depuis le site ; laissez vide sinon.
