name: Sonde API isochrone IGN (temporaire)

on:
  push:
    branches: [claude/p1-temps-de-route]
    paths: [.github/workflows/sonde-ign.yml]

jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - name: Durée de calcul selon le temps de route et la ressource
        shell: bash
        run: |
          set +e
          essai() { # ressource, secondes, lon,lat
            curl -sS -m 120 -D h.txt -o iso.json \
              "https://data.geopf.fr/navigation/isochrone?point=$3&resource=$1&costValue=$2&costType=time&profile=car&direction=departure&timeUnit=second&geometryFormat=geojson" \
              -w "$1 $(( $2 / 60 )) min depuis $3 : HTTP %{http_code} en %{time_total}s, %{size_download} octets" 2>&1
            python3 -c "
          import json; d=json.load(open('iso.json')); g=d.get('geometry') or {}
          def n(x): return 1 if isinstance(x[0],(int,float)) else sum(n(y) for y in x)
          print(' ->', g.get('type'), n(g['coordinates']) if g else '-', 'points')" 2>/dev/null || echo " -> $(head -c 200 iso.json)"
            grep -i ratelimit h.txt | tr '\n' ' '; echo
            sleep 2
          }
          for t in 900 1800 2700 3600 5400 7200; do essai bdtopo-valhalla $t 4.3601,43.8367; done
          for t in 1800 3600 7200; do essai bdtopo-pgr $t 4.3601,43.8367; done
          for t in 3600 7200; do essai bdtopo-valhalla $t 3.078,44.098; done
          essai bdtopo-valhalla 3600 4.3601,43.8367
      - name: Rafale de 6 requêtes de 15 min (limite annoncée)
        shell: bash
        run: |
          for i in 1 2 3 4 5 6; do
            curl -sS -m 60 -o /dev/null -w "%{http_code} " "https://data.geopf.fr/navigation/isochrone?point=3.078,44.098&resource=bdtopo-valhalla&costValue=$((850+i*10))&costType=time&profile=car&geometryFormat=geojson" &
          done; wait; echo
