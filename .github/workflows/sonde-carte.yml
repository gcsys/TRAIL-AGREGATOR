name: Sonde fond de carte (temporaire)
on:
  push:
    branches: [claude/sonde-carte]
permissions:
  contents: write
jobs:
  sonde:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: claude/fond-de-carte
          path: site-test
      - name: Tuiles IGN, OpenTopoMap, Esri
        run: |
          for u in "https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2&STYLE=normal&TILEMATRIXSET=PM&FORMAT=image/png&TILEMATRIX=6&TILEROW=22&TILECOL=32" \
                   "https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2&STYLE=normal&TILEMATRIXSET=PM&FORMAT=image/png&TILEMATRIX=19&TILEROW=191500&TILECOL=268000" \
                   "https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2&STYLE=normal&TILEMATRIXSET=PM&FORMAT=image/png&TILEMATRIX=4&TILEROW=5&TILECOL=8" \
                   "https://a.tile.opentopomap.org/6/32/22.png" \
                   "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/6/22/32"; do
            curl -s -o t.bin -D h.txt -H "Referer: https://gcsys.github.io/" -H "User-Agent: Mozilla/5.0" -w "%{time_total}s" "$u" > tps.txt
            echo "$(head -1 h.txt | tr -d '\r') | $(grep -i '^content-type' h.txt | tr -d '\r') | $(stat -c%s t.bin) octets | $(cat tps.txt) | $u"
          done
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Site de la branche dans Chromium
        run: |
          mkdir -p sonde
          (cd site-test/site && python3 -m http.server 8000 >/dev/null 2>&1 &)
          npm i --no-save playwright@1.48.2 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > s.js <<'JS'
          const { chromium, devices } = require('playwright');
          setTimeout(() => { console.log('watchdog'); process.exit(1); }, 300000);
          (async () => {
            const b = await chromium.launch();
            const cas = [
              ['ordinateur', { viewport: { width: 1280, height: 800 }, deviceScaleFactor: 2 }, 'http://localhost:8000/'],
              ['ordinateur-zoom', { viewport: { width: 1280, height: 800 }, deviceScaleFactor: 2 }, 'http://localhost:8000/?autour=44.0985,3.0785,10,Millau'],
              ['mobile-carte', devices['iPhone 13'], 'http://localhost:8000/'],
              ['mobile-liste', devices['iPhone 13'], 'http://localhost:8000/'],
            ];
            for (const [nom, opts, url] of cas) {
              const p = await (await b.newContext(opts)).newPage();
              const tuiles = [], errs = [];
              p.on('pageerror', e => errs.push(e.message));
              p.on('response', async r => { if (/geopf\.fr\/wmts|cartocdn/.test(r.url())) { let n = 0; try { n = (await r.body()).length; } catch (e) {} tuiles.push([r.status(), n, r.url().replace(/.*TILEMATRIX=/, 'z=')]); } });
              p.on('requestfailed', r => { if (/geopf/.test(r.url())) tuiles.push(['échec ' + r.failure().errorText, 0, r.url().replace(/.*TILEMATRIX=/, 'z=')]); });
              const t0 = Date.now();
              await p.goto(url, { waitUntil: 'networkidle', timeout: 90000 }).catch(e => console.log(e.message));
              if (nom === 'mobile-carte') { const btn = await p.$('#view-map, .fab, [data-view="map"]'); if (btn) { await btn.click().catch(() => {}); await p.waitForLoadState('networkidle').catch(() => {}); } }
              await p.waitForTimeout(3000);
              await p.screenshot({ path: `sonde/${nom}.png` });
              const ok = tuiles.filter(t => t[0] === 200);
              console.log(nom, `${Date.now() - t0} ms`, `tuiles ${ok.length}/${tuiles.length} en 200`, `${Math.round(ok.reduce((a, t) => a + t[1], 0) / 1024)} Ko`, 'erreurs', JSON.stringify(errs));
              tuiles.filter(t => t[0] !== 200).forEach(t => console.log('   ', t.join(' ')));
            }
            process.exit(0);
          })();
          JS
          node s.js
      - name: Captures dans la branche
        run: |
          git config user.name "trail-bot"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sonde && git commit -qm "sonde: captures" && git push -q origin HEAD:claude/sonde-carte
