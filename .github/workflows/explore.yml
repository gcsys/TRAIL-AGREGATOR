name: explore-datatourisme
on:
  push:
    branches: [explore-datatourisme]
jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sSL https://www.data.gouv.fr/api/1/datasets/5b598be088ee387c0c353714/ > ds.json
          python3 -c "import json;d=json.load(open('ds.json'));[print(r['title'],r['url']) for r in d['resources']]"
          OCC=$(python3 -c "import json;d=json.load(open('ds.json'));print([r['url'] for r in d['resources'] if r['title']=='datatourisme-reg-occ.csv'][0])")
          FMA=$(python3 -c "import json;d=json.load(open('ds.json'));print([r['url'] for r in d['resources'] if r['title']=='datatourisme-fma.csv'][0])")
          curl -sSL -o occ.csv "$OCC"
          curl -sSL -o fma.csv "$FMA"
          head -c 600 occ.csv; echo
          ls -la
          python3 - <<'PY'
          import csv, sys, re
          csv.field_size_limit(10**9)
          for fn in ("occ.csv", "fma.csv"):
              with open(fn, encoding="utf-8", errors="replace") as f:
                  sample = f.read(4096); f.seek(0)
                  dialect = csv.Sniffer().sniff(sample.split("\n")[0])
                  r = csv.reader(f, dialect)
                  head = next(r)
                  print("=====", fn, "delimiter", repr(dialect.delimiter))
                  print("HEADER", head)
                  n = 0; hits = 0
                  for row in r:
                      n += 1
                      line = " ".join(row)
                      if re.search(r"\btrail\b", line, re.I):
                          hits += 1
                          if hits <= 15:
                              print("ROW", [x[:150] for x in row])
                  print("rows", n, "trail hits", hits)
          PY
