name: Sonde DATAtourisme (temporaire)
on:
  push:
    branches: [claude/sonde-datatourisme]
jobs:
  sonde:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python sonde.py
