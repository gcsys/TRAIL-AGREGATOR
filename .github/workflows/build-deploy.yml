name: Mise à jour des données et déploiement

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1" # chaque lundi à 4h UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Import des sources et génération de la base
        run: python scripts/build_db.py
      - name: Commit de la base si elle a changé
        run: |
          git config user.name "trail-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/races.json site/data/index.json site/data/detail data/geocode_cache.json
          git add data/sources/datatourisme_cache.csv 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Aucun changement"
          else
            git commit -m "data: mise à jour automatique des courses"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Version des fichiers (évite l'ancien code en cache dans les navigateurs)
        run: sed -i "s/__BUILD__/${GITHUB_SHA::8}/g" site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
