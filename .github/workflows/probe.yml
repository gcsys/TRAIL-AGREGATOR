name: Sonde sources (manuel)
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "URLs séparées par des espaces"
        required: true
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          URLS: ${{ github.event.inputs.urls }}
        run: python scripts/tools/probe.py $URLS
