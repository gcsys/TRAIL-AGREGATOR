name: Test navigateur temps de route (temporaire)

on:
  push:
    branches: [claude/p1-temps-de-route]
    paths: [.github/sonde/**, .github/workflows/sonde-navigateur.yml, site/**]

permissions:
  contents: write

jobs:
  navigateur:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Playwright
        run: |
          cd .github/sonde && npm init -y >/dev/null && npm i playwright@1.49.1 >/dev/null && npx playwright install --with-deps chromium >/dev/null
      - name: Site servi en local et test
        run: |
          (cd site && python3 -m http.server 8000 >/dev/null 2>&1 &)
          sleep 1
          OUT=$PWD/captures node .github/sonde/navigateur.js
      - name: Captures publiées sur la branche « captures »
        run: |
          git fetch origin captures
          git worktree add ../cap origin/captures
          mkdir -p ../cap/p1-temps-de-route && cp captures/* ../cap/p1-temps-de-route/
          cd ../cap
          git config user.name "trail-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -m "Captures temps de route" && git push origin HEAD:captures
          git log -1 --format=%H
